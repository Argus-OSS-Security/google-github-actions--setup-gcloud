name: 'Release'

# Triggers intentionally disabled for Argus-OSS-Security.
# on:
#   push:
#     branches:
#       - 'main'
#       - 'release/**/*'
# 
jobs:
  release:
    uses: 'google-github-actions/.github/.github/workflows/release.yml@v3' # ratchet:exclude
    permissions:
      attestations: 'write'
      contents: 'write'
      packages: 'write'
    secrets:
      ACTIONS_BOT_TOKEN: '${{ secrets.ACTIONS_BOT_TOKEN }}'
